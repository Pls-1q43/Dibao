name: Publish Docker Image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build, such as v0.3.1 or main"
        required: true
        default: "main"
      image_tag:
        description: "Image tag to publish, such as v0.3.1-test"
        required: true
        default: "manual"
      publish_moving_aliases:
        description: "Also publish stable and latest"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release source gates
        shell: bash
        run: |
          npm test
          npm run typecheck
          npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

      - name: Compute image name
        id: image
        shell: bash
        run: |
          echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare private Sentry config
        shell: bash
        env:
          DIBAO_SENTRY_CONFIG_JSON: ${{ secrets.DIBAO_SENTRY_CONFIG_JSON }}
        run: |
          if [ -z "$DIBAO_SENTRY_CONFIG_JSON" ]; then
            echo "::error::DIBAO_SENTRY_CONFIG_JSON is required for release Docker images."
            exit 1
          fi

          sentry_config="${RUNNER_TEMP}/dibao-sentry.json"
          printf '%s' "$DIBAO_SENTRY_CONFIG_JSON" > "$sentry_config"
          chmod 600 "$sentry_config"

          node - "$sentry_config" <<'NODE'
          const fs = require("node:fs");
          const path = process.argv[2];
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          const missing = ["dsn", "org", "project"].filter((key) => !String(config[key] ?? "").trim());
          if (missing.length > 0) {
            console.error(`DIBAO_SENTRY_CONFIG_JSON is missing required key(s): ${missing.join(", ")}`);
            process.exit(1);
          }
          console.log("Sentry config check:", {
            hasDsn: Boolean(config.dsn),
            hasOrg: Boolean(config.org),
            hasProject: Boolean(config.project)
          });
          NODE

          echo "DIBAO_SENTRY_CONFIG_FILE=$sentry_config" >> "$GITHUB_ENV"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.image_tag || 'manual' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=stable,enable=${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || (github.event_name == 'workflow_dispatch' && inputs.publish_moving_aliases) }}
            type=raw,value=latest,enable=${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || (github.event_name == 'workflow_dispatch' && inputs.publish_moving_aliases) }}
          labels: |
            org.opencontainers.image.title=Dibao
            org.opencontainers.image.description=Self-hosted single-user personalized RSS reader

      - name: Build release candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: dibao-release-candidate:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          secret-files: |
            dibao_sentry_config=${{ env.DIBAO_SENTRY_CONFIG_FILE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify candidate image Sentry config
        shell: bash
        run: |
          image_ref="dibao-release-candidate:${GITHUB_SHA}"
          docker run -i --rm --platform linux/amd64 "$image_ref" node --input-type=module - <<'NODE'
          import { readFileSync, readdirSync } from "node:fs";
          import { join } from "node:path";

          const runtime = JSON.parse(readFileSync("/app/.dibao/sentry.json", "utf8"));
          const assetsDir = "/app/apps/web/dist/assets";
          const jsBundle = readdirSync(assetsDir)
            .filter((file) => file.endsWith(".js"))
            .map((file) => readFileSync(join(assetsDir, file), "utf8"))
            .join("\n");

          const runtimeReport = {
            hasDsn: Boolean(String(runtime.dsn ?? "").trim()),
            hasOrg: Boolean(String(runtime.org ?? "").trim()),
            hasProject: Boolean(String(runtime.project ?? "").trim())
          };
          const browserReport = {
            hasDsn: Boolean(runtime.dsn && jsBundle.includes(runtime.dsn)),
            hasOrg: Boolean(runtime.org && jsBundle.includes(runtime.org)),
            hasProject: Boolean(runtime.project && jsBundle.includes(runtime.project))
          };

          console.log(
            `Runtime Sentry config: hasDsn=${runtimeReport.hasDsn} hasOrg=${runtimeReport.hasOrg} hasProject=${runtimeReport.hasProject}`
          );
          console.log(
            `Browser Sentry config: hasDsn=${browserReport.hasDsn} hasOrg=${browserReport.hasOrg} hasProject=${browserReport.hasProject}`
          );

          if (
            !runtimeReport.hasDsn ||
            !runtimeReport.hasOrg ||
            !runtimeReport.hasProject ||
            !browserReport.hasDsn ||
            !browserReport.hasOrg ||
            !browserReport.hasProject
          ) {
            throw new Error("Published image is missing required Sentry config.");
          }
          NODE

      - name: Verify release container install and upgrade
        shell: bash
        run: |
          image_ref="dibao-release-candidate:${GITHUB_SHA}"
          previous_image="${{ steps.image.outputs.name }}:v0.3.1"
          oldest_image="${{ steps.image.outputs.name }}:v0.2.1"
          expected_version="$(node -p "require('./package.json').version")"
          fresh_name="dibao-release-fresh-${GITHUB_RUN_ID}"
          old_name="dibao-release-upgrade-old-${GITHUB_RUN_ID}"
          new_name="dibao-release-upgrade-new-${GITHUB_RUN_ID}"
          oldest_old_name="dibao-release-oldest-old-${GITHUB_RUN_ID}"
          oldest_new_name="dibao-release-oldest-new-${GITHUB_RUN_ID}"
          fresh_data="$(mktemp -d)"
          upgrade_data="$(mktemp -d)"
          oldest_upgrade_data="$(mktemp -d)"
          chmod 777 "$fresh_data" "$upgrade_data" "$oldest_upgrade_data"

          cleanup() {
            docker rm -f "$fresh_name" "$old_name" "$new_name" "$oldest_old_name" "$oldest_new_name" >/dev/null 2>&1 || true
            sudo rm -rf "$fresh_data" "$upgrade_data" "$oldest_upgrade_data"
          }
          trap cleanup EXIT

          wait_health() {
            local name="$1"
            local url="$2"
            local expected_version="$3"
            for _ in $(seq 1 90); do
              local body
              body="$(curl -fsS "$url/api/system/health" 2>/dev/null || true)"
              if BODY="$body" EXPECTED_VERSION="$expected_version" node -e 'try { const json = JSON.parse(process.env.BODY || ""); process.exit(json.data?.ok === true && json.data?.version === process.env.EXPECTED_VERSION ? 0 : 1); } catch { process.exit(1); }'; then
                return 0
              fi
              sleep 2
            done
            docker logs "$name" --tail 250 || true
            echo "::error::Container $name did not become healthy with version $expected_version."
            return 1
          }

          latest_migration() {
            local name="$1"
            docker exec "$name" node -e 'const Database = require("better-sqlite3"); const db = new Database("/data/dibao.sqlite", { readonly: true }); const row = db.prepare("select version, name from schema_migrations order by version desc limit 1").get(); console.log(`${row.version} ${row.name}`); db.close();'
          }

          wait_latest_migration() {
            local name="$1"
            local expected="$2"
            local upgrade_url="${3:-}"
            for _ in $(seq 1 90); do
              if [ -n "$upgrade_url" ]; then
                curl -fsS "$upgrade_url/api/system/upgrade/status" >/dev/null 2>&1 || true
              fi
              local latest
              latest="$(latest_migration "$name" 2>/dev/null || true)"
              if [ "$latest" = "$expected" ]; then
                echo "Latest migration for $name: $latest"
                return 0
              fi
              sleep 2
            done
            docker logs "$name" --tail 250 || true
            echo "::error::Container $name did not reach migration $expected."
            return 1
          }

          seed_legacy_vector_index() {
            local name="$1"
            docker exec -i "$name" node --input-type=module - <<'NODE'
          import {
            openDatabase,
            SqliteArticleRepository,
            SqliteEmbeddingRepository,
            SqliteFeedRepository,
            toVectorBlob
          } from "@dibao/db";

          const db = openDatabase("/data/dibao.sqlite", { migrate: false });
          try {
            const now = Date.now();
            new SqliteFeedRepository(db).upsert({
              id: "release_upgrade_feed",
              title: "Release upgrade fixture",
              feedUrl: "https://example.invalid/release-upgrade.xml",
              now
            });
            new SqliteArticleRepository(db).upsert({
              id: "release_upgrade_article",
              feedId: "release_upgrade_feed",
              url: "https://example.invalid/release-upgrade",
              title: "Release upgrade fixture",
              dedupeKey: "release-upgrade-fixture",
              now
            });
            const embeddings = new SqliteEmbeddingRepository(db);
            embeddings.upsertProvider({
              id: "release_upgrade_provider",
              type: "embedded_local",
              name: "Release upgrade fixture",
              model: "release-upgrade-2d",
              dimension: 2,
              enabled: true,
              now
            });
            embeddings.createIndex({
              id: "release_upgrade_index",
              providerId: "release_upgrade_provider",
              model: "release-upgrade-2d",
              dimension: 2,
              now
            });
            db.exec("create virtual table vec_articles_release_upgrade_index using vec0(embedding float[2])");
            const vectorBlob = toVectorBlob([1, 0]);
            db.prepare(`
              insert into article_embeddings (
                article_id, embedding_index_id, vector_blob, content_hash, created_at, updated_at
              ) values ('release_upgrade_article', 'release_upgrade_index', ?, 'release-upgrade-hash', ?, ?)
            `).run(vectorBlob, now, now);
            const vecRowid = Number(
              db.prepare("insert into vec_articles_release_upgrade_index (embedding) values (?)")
                .run(vectorBlob).lastInsertRowid
            );
            db.prepare(`
              insert into article_vector_rows (
                article_id, embedding_index_id, vec_rowid, created_at
              ) values ('release_upgrade_article', 'release_upgrade_index', ?, ?)
            `).run(vecRowid, now);
          } finally {
            db.close();
          }
          NODE
          }

          vector_upgrade_complete() {
            local name="$1"
            docker exec "$name" node -e 'const Database = require("better-sqlite3"); const db = new Database("/data/dibao.sqlite", { readonly: true }); const table = db.prepare("select sql from sqlite_master where name = ?").get("vec_articles_release_upgrade_index"); const embeddings = db.prepare("select count(*) as count from article_embeddings where embedding_index_id = ?").get("release_upgrade_index").count; const mappings = db.prepare("select count(*) as count from article_vector_rows where embedding_index_id = ?").get("release_upgrade_index").count; db.close(); process.exit(table?.sql?.includes("distance_metric=cosine") && embeddings === 1 && mappings === 1 ? 0 : 1);'
          }

          wait_vector_upgrade() {
            local name="$1"
            for _ in $(seq 1 180); do
              if vector_upgrade_complete "$name" >/dev/null 2>&1; then
                echo "Legacy vector index upgraded to cosine without replacing embeddings."
                return 0
              fi
              sleep 2
            done
            docker logs "$name" --tail 250 || true
            echo "::error::Container $name did not finish the legacy vector index upgrade."
            return 1
          }

          docker run -d --name "$fresh_name" -p 18081:8080 -v "$fresh_data:/data" "$image_ref"
          wait_health "$fresh_name" "http://127.0.0.1:18081" "$expected_version"
          wait_latest_migration "$fresh_name" "027 recommendation_sessions"
          docker rm -f "$fresh_name"

          docker pull "$previous_image"
          docker run -d --name "$old_name" -p 18082:8080 -v "$upgrade_data:/data" "$previous_image"
          wait_health "$old_name" "http://127.0.0.1:18082" "0.3.1"
          wait_latest_migration "$old_name" "026 recommendation_v3_memory"
          seed_legacy_vector_index "$old_name"
          docker rm -f "$old_name"

          docker run -d --name "$new_name" -p 18083:8080 -v "$upgrade_data:/data" "$image_ref"
          wait_health "$new_name" "http://127.0.0.1:18083" "$expected_version"
          wait_latest_migration "$new_name" "027 recommendation_sessions"
          wait_vector_upgrade "$new_name"
          docker rm -f "$new_name"

          docker pull "$oldest_image"
          docker run -d --name "$oldest_old_name" -p 18084:8080 -v "$oldest_upgrade_data:/data" "$oldest_image"
          wait_health "$oldest_old_name" "http://127.0.0.1:18084" "0.2.1"
          wait_latest_migration "$oldest_old_name" "025 recommended_rank_sort_index"
          docker rm -f "$oldest_old_name"

          docker run -d --name "$oldest_new_name" -p 18085:8080 -v "$oldest_upgrade_data:/data" "$image_ref"
          wait_health "$oldest_new_name" "http://127.0.0.1:18085" "$expected_version"
          wait_latest_migration "$oldest_new_name" "027 recommendation_sessions"

      - name: Publish verified multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secret-files: |
            dibao_sentry_config=${{ env.DIBAO_SENTRY_CONFIG_FILE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
