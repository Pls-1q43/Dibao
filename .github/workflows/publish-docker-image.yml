name: Publish Docker Image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build, such as v0.4.0 or release/v0.4.0"
        required: true
        default: "main"
      image_tag:
        description: "Matching release tag (v0.4.0), or a non-version test tag"
        required: true
        default: "manual"
      publish_moving_aliases:
        description: "Also promote the verified release to stable and latest"
        required: true
        type: boolean
        default: false
      allow_existing_release_repair:
        description: "Explicitly authorize replacing an existing formal image for a same-version pipeline repair"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# Serialize promotions across tags/manual runs; never interrupt an active release.
concurrency:
  group: docker-release-${{ github.repository }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Gate, stage, verify and promote the exact multiarch image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out release source and historical tags
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check release version consistency
        id: version
        env:
          RELEASE_IMAGE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.image_tag }}
          RELEASE_MOVING_ALIASES: ${{ (github.event_name == 'push' && !contains(github.ref_name, '-')) || (github.event_name == 'workflow_dispatch' && inputs.publish_moving_aliases) }}
        run: node scripts/release/check-version.mjs

      - name: Compute checked-out source identity
        id: image
        shell: bash
        run: |
          echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run source and cross-tag migration gates
        env:
          DIBAO_SENTRY_UPLOAD_SOURCEMAPS: "0"
        run: |
          npm test
          npm run typecheck
          npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
          npm run build
          node --import tsx --test scripts/release/*.test.mjs
          node --import tsx scripts/smoke/historical-upgrade.ts

      - name: Run full desktop/mobile E2E against the gated source build
        run: |
          node scripts/e2e/prepare.mjs
          npx playwright test

      - name: Preserve E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-e2e-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare private Sentry config (including source-map authorization)
        shell: bash
        env:
          DIBAO_SENTRY_CONFIG_JSON: ${{ secrets.DIBAO_SENTRY_CONFIG_JSON }}
        run: |
          node --input-type=module - <<'NODE'
          import { writeFileSync, appendFileSync } from "node:fs";
          const path = `${process.env.RUNNER_TEMP}/dibao-sentry.json`;
          try {
            const config = JSON.parse(process.env.DIBAO_SENTRY_CONFIG_JSON || "{}");
            const ready = ["dsn", "org", "project", "authToken"].every(key => typeof config[key] === "string" && config[key].trim());
            if (!ready) throw new Error();
            writeFileSync(path, JSON.stringify(config), { mode: 0o600 });
            appendFileSync(process.env.GITHUB_ENV, `DIBAO_SENTRY_CONFIG_FILE=${path}\n`);
            console.log("Sentry config: hasDsn=true hasOrg=true hasProject=true hasUploadAuth=true");
          } catch {
            console.error("::error::Release Sentry configuration is missing or invalid; private values suppressed.");
            process.exit(1);
          }
          NODE

      - name: Extract final Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.image_tag || 'manual' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=stable,enable=${{ (github.event_name == 'push' && !contains(github.ref_name, '-')) || (github.event_name == 'workflow_dispatch' && inputs.publish_moving_aliases) }}
            type=raw,value=latest,enable=${{ (github.event_name == 'push' && !contains(github.ref_name, '-')) || (github.event_name == 'workflow_dispatch' && inputs.publish_moving_aliases) }}
          labels: |
            org.opencontainers.image.title=Dibao
            org.opencontainers.image.description=Self-hosted single-user personalized RSS reader
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      # Only this run-scoped tag is visible before acceptance. Never move release
      # tags until BOTH published platforms pass. The verified digest is promoted.
      - name: Build and stage multi-platform candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DIBAO_SENTRY_UPLOAD_SOURCEMAPS=1
          secret-files: |
            dibao_sentry_config=${{ env.DIBAO_SENTRY_CONFIG_FILE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify exact published amd64 and arm64 images
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_REVISION: ${{ steps.image.outputs.revision }}
        run: node scripts/release/verify-docker-release.mjs

      - name: Promote only the verified manifest (no rebuild)
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          ALLOW_EXISTING_RELEASE_REPAIR: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_existing_release_repair }}
        run: node scripts/release/promote-image.mjs

      - name: Remove temporary private config
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/dibao-sentry.json"
